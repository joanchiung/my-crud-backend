services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backend_notes
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: notes_postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_notes -d notes_postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
